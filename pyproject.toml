[project]
name = "jobs-scraper"
version = "0.1.0"
description = "Flask Web application that uses python-jobspy to display jobs"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "annotated-types==0.7.0",
    "beautifulsoup4==4.12.3",
    "bleach==6.4.0",
    "blinker==1.9.0",
    "certifi==2026.10.19",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "idna==3.15",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "joblib==1.4.2",
    "lxml==6.1.3",
    "markdownify>=1.1.0",
    "markupsafe==2.1.5",
    "nltk==3.10.4",
    "numpy==1.26.3",
    "pandas==2.2.2",
    "pydantic==2.7.1",
    "pydantic-core==2.18.2",
    "pymupdf>=1.25.5",
    "python-dateutil==2.9.0.post0",
    "python-docx>=1.1.2",
    "python-jobspy==1.4.0",
    "pytz==2024.1",
    "regex>=2025.10.22",
    "requests==2.34.2",
    "scikit-learn>=1.6.1",
    "scipy==1.15.2",
    "sentence-transformers>=3.3.1",
    "six==1.16.0",
    "soupsieve==2.9.0",
    "torch>=2.2",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "typing-extensions==4.12.0",
    "tzdata==2024.1",
    "urllib3==2.8.0",
    "webencodings==0.5.1",
    "werkzeug==3.1.9",
]

# No [build-system] needed — this is an application, not a library.
# uv treats it as a virtual project automatically.

[tool.uv]
# Transitive deps (pulled in by sentence-transformers) with known CVEs
constraint-dependencies = ["transformers>=5.10.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true