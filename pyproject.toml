[project]
name = "jobs-scraper"
version = "0.1.0"
description = "Flask Web application that uses python-jobspy to display jobs"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "annotated-types==0.7.0",
    "beautifulsoup4==4.12.3",
    "bleach==6.2.0",
    "blinker==1.8.2",
    "certifi==2024.2.2",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "flask==3.0.3",
    "idna==3.7",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "joblib==1.4.2",
    "lxml==5.3.2",
    "markdownify==0.13.1",
    "markupsafe==2.1.5",
    "nltk==3.9.1",
    "numpy==1.26.3",
    "pandas==2.2.2",
    "pydantic==2.7.1",
    "pydantic-core==2.18.2",
    "pymupdf>=1.25.5",
    "python-dateutil==2.9.0.post0",
    "python-docx>=1.1.2",
    "python-jobspy==1.1.82",
    "pytz==2024.1",
    "regex==2024.5.15",
    "requests==2.32.3",
    "scikit-learn>=1.6.1",
    "scipy==1.15.2",
    "sentence-transformers>=3.3.1",
    "six==1.16.0",
    "soupsieve==2.5",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "typing-extensions==4.12.0",
    "tzdata==2024.1",
    "urllib3==2.2.1",
    "webencodings==0.5.1",
    "werkzeug==3.0.3",
